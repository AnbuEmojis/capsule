<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CryptoChain Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light text-dark">
  <div class="container py-5">
    <h1 class="text-center mb-4">🌐 CryptoChain Liquidity Dashboard</h1>

    <!-- Wallet Section -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h4>🔐 Wallet Manager</h4>
        <div>
          <button class="btn btn-primary btn-sm" onclick="generateWallet()">+ New Wallet</button>
          <button class="btn btn-secondary btn-sm" onclick="fetchWallets()">↻ Refresh</button>
        </div>
      </div>
      <select id="walletSelect" class="form-select mb-3" onchange="updateWalletInfo()"></select>
      <p><strong>Address:</strong> <span id="wallet-address">N/A</span></p>
      <p><strong>CAP:</strong> <span id="wallet-cap">0</span></p>
      <p><strong>NATIVE:</strong> <span id="wallet-native">0</span></p>
    </section>

    <!-- Swap Interface -->
    <section class="mb-5">
      <h4>💱 Token Swap</h4>
      <div class="row g-2 mb-2">
        <div class="col-md-3">
          <input id="inputAmount" type="number" min="0" class="form-control" value="10" />
        </div>
        <div class="col-md-3">
          <select id="inputSymbol" class="form-select">
            <option value="CAP">CAP ➝ NATIVE</option>
            <option value="NATIVE">NATIVE ➝ CAP</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-success w-100" onclick="handleSwap()">Swap</button>
        </div>
      </div>
      <p><strong>Result:</strong> <span id="swapResult">—</span></p>
    </section>

    <!-- Liquidity Stats -->
    <section class="mb-5">
      <h4>📊 Liquidity Pool</h4>
      <ul class="list-group mb-3">
        <li class="list-group-item">CAP Reserves: <strong id="reserve-cap">0</strong></li>
        <li class="list-group-item">NATIVE Reserves: <strong id="reserve-native">0</strong></li>
        <li class="list-group-item">CAP/NATIVE Price: <strong id="cap-price">0</strong></li>
      </ul>
      <canvas id="priceChart" height="150"></canvas>
    </section>
  </div>

  <!-- JS Includes -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Dashboard Logic -->
  <script>
    let currentWallet = null;
    let priceChart;
    let chartData = {
      labels: [],
      datasets: [{
        label: "CAP/NATIVE",
        data: [],
        fill: false,
        borderColor: "blue",
        tension: 0.1
      }]
    };

    async function fetchWallets() {
      const res = await fetch('/api/wallets');
      const wallets = await res.json();
      const walletSelect = document.getElementById('walletSelect');
      walletSelect.innerHTML = '';

      wallets.forEach(w => {
        const option = document.createElement('option');
        option.value = w.address;
        option.text = w.address.slice(0, 10) + '...';
        walletSelect.appendChild(option);
      });

      currentWallet = wallets[0]?.address;
      updateWalletInfo();
    }

    async function updateWalletInfo() {
      if (!currentWallet) return;
      const res = await fetch(`/api/wallet-info?address=${currentWallet}`);
      const info = await res.json();
      document.getElementById('wallet-address').innerText = info.address;
      document.getElementById('wallet-cap').innerText = info.capTokenBalance;
      document.getElementById('wallet-native').innerText = info.balance;
    }

    async function generateWallet() {
      const res = await fetch('/api/generate-wallet', { method: 'POST' });
      const newWallet = await res.json();
      alert(`Wallet created:\n${newWallet.address}`);
      fetchWallets();
    }

    async function handleSwap() {
      const amount = parseFloat(document.getElementById('inputAmount').value);
      const inputSymbol = document.getElementById('inputSymbol').value;
      const res = await fetch('/api/swap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inputSymbol, inputAmount: amount, senderAddress: currentWallet })
      });
      const data = await res.json();
      if (data.type === 'success') {
        document.getElementById('swapResult').innerText =
          `${data.swapTx.outputAmount} ${data.swapTx.outputSymbol}`;
        updateWalletInfo();
      } else {
        document.getElementById('swapResult').innerText = data.message;
      }
    }

    async function updateLiquidityStats() {
      const res = await fetch('/api/liquidity-stats');
      const stats = await res.json();
      document.getElementById('reserve-cap').innerText = stats.reserveCAP;
      document.getElementById('reserve-native').innerText = stats.reserveNATIVE;
      document.getElementById('cap-price').innerText = (stats.reserveNATIVE / stats.reserveCAP).toFixed(4);

      updateChart(stats.reserveNATIVE / stats.reserveCAP);
    }

    function updateChart(price) {
      const now = new Date().toLocaleTimeString();
      chartData.labels.push(now);
      chartData.datasets[0].data.push(price);

      if (chartData.labels.length > 20) {
        chartData.labels.shift();
        chartData.datasets[0].data.shift();
      }

      if (!priceChart) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        priceChart = new Chart(ctx, { type: 'line', data: chartData });
      } else {
        priceChart.update();
      }
    }

    // Startup
    fetchWallets();
    updateLiquidityStats();
    setInterval(updateLiquidityStats, 5000);
  </script>
</body>
</html>
