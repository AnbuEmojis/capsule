<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Vendor libs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <header class="dashboard-header d-flex align-items-center mb-4">
    <img src="/pictures/cti.png" alt="Centra Tech Icon" class="logo-icon">
    <h1 class="dashboard-title">Dashboard</h1>
  </header>

  <div class="container py-4">
    <!-- Wallet Manager -->
    <section class="card wallet-manager p-4 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>🔐 Wallet Manager</h4>
        <div>
          <button id="new-wallet-btn" class="btn btn-brand me-2">+ New Wallet</button>
          <button id="import-bip39-btn" class="btn btn-outline-secondary me-2">Import 24-word</button>
<button id="import-19-btn" class="btn btn-outline-secondary me-2">Import 19-word</button>
          <button id="refresh-wallets-btn" class="btn btn-secondary me-2">↻ Refresh</button>
          <button id="import-key-btn" class="btn btn-outline-secondary me-2">Import Key (dev)</button>
          <button id="export-key-btn" class="btn btn-outline-secondary me-2">Export Key</button>
          <p class="small text-muted" id="key-status">Key: unknown</p>
          <button id="faucet-btn" class="btn btn-warning me-2">Get 100 CAP (dev)</button>
          <button id="mine-btn" class="btn btn-outline-primary">⛏️ Mine</button>
          <div id="mine-result" class="text-muted small mt-2"></div>
        </div>
      </div>

      <select id="walletSelect" class="form-select mb-3"></select>

      <div class="row">
        <div class="col-md-4">
          <p><strong>Address:</strong> <span id="wallet-address">N/A</span></p>
        </div>
        <div class="col-md-4">
          <p><strong>CAP:</strong> <span id="wallet-cap">0</span></p>
        </div>
        <div class="col-md-4">
          <p><strong>NATIVE:</strong> <span id="wallet-native">0</span></p>
        </div>
      </div>
    </section>

    <!-- Swap Section -->
    <section class="card swap-section p-4 mb-5">
      <h4 class="mb-3">
        <img src="/pictures/ctb.png" alt="CAP" style="width:24px;vertical-align:middle;">
        Swap
      </h4>

      <div class="btn-group mb-3" role="group" aria-label="swap-direction">
        <input type="radio" class="btn-check" name="swap-direction" id="dir-cap-to-native" autocomplete="off" checked>
        <label class="btn btn-outline-primary" for="dir-cap-to-native">Sell CAP → NATIVE</label>

        <input type="radio" class="btn-check" name="swap-direction" id="dir-native-to-cap" autocomplete="off">
        <label class="btn btn-outline-primary" for="dir-native-to-cap">Buy CAP ← NATIVE</label>
      </div>

      <div class="row g-2 align-items-center">
        <div class="col-auto">
          <label for="swap-amount" class="col-form-label" id="amount-label">Amount (CAP)</label>
        </div>
        <div class="col">
          <input type="number" id="swap-amount" class="form-control" placeholder="Amount" min="0" step="any">
        </div>

        <div class="row g-2 align-items-center mt-2">
          <div class="col-auto">
            <label for="swap-fee" class="col-form-label">Miner Fee (NATIVE)</label>
          </div>
          <div class="col">
            <input type="number" id="swap-fee" class="form-control" placeholder="0" min="0" step="any" value="0">
          </div>
        </div>

        <div class="col-auto">
          <button id="swap-exec-btn" class="btn btn-brand">Swap</button>
        </div>
      </div>
    </section>

    <!-- Send CAP -->
    <section class="card p-4 mb-5">
      <h4>Send CAP</h4>
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <label class="form-label">Recipient Address</label>
          <input type="text" id="send-to" class="form-control" placeholder="04abcd...">
        </div>
        <div class="col-md-3">
          <label class="form-label">Amount (CAP)</label>
          <input type="number" id="send-amount" class="form-control" min="0" step="any" placeholder="0">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button id="send-cap-btn" class="btn btn-brand">Send</button>
        </div>
      </div>
      <div class="text-muted small mt-2" id="send-status"></div>
    </section>

    <!-- Explorer -->
    <section class="card p-4 mb-5">
      <h4>Explorer</h4>
      <div class="text-muted small" id="explorer-head">—</div>
      <div class="row mt-3">
        <div class="col-md-6">
          <h6>Recent Blocks</h6>
          <ul id="blocks-list" class="list-group"></ul>
        </div>
        <div class="col-md-6">
          <h6>Recent CAP Transfers</h6>
          <ul id="transfers-list" class="list-group"></ul>
        </div>
      </div>
      <div class="mt-3">
        <button id="explorer-refresh" class="btn btn-secondary btn-sm">Refresh</button>
      </div>
    </section>

    <!-- Price Chart -->
    <section class="card chart-section p-4 mb-5">
      <h4>Liquidity Pool Prices</h4>
      <div id="cap-rate" class="text-muted small"></div>
      <canvas id="price-chart" width="600" height="300"></canvas>
      <div id="chart-error" class="text-danger small mt-2"></div>
    </section>

    <section class="card p-4 mb-5">
      <h4>Mining</h4>
      <div class="text-muted small mb-2" id="mining-stats">—</div>
      <button id="refresh-mining" class="btn btn-secondary btn-sm">Refresh</button>
      <ul id="mempool-list" class="list-group mt-3"></ul>
    </section>

    <!-- Transaction History -->
    <section id="tx-history" class="card p-4 mb-5">
      <h4>Transaction History</h4>
      <ul id="history-list" class="list-group"></ul>
    </section>

    <!-- Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
      <div id="purchaseToast" class="toast align-items-center text-bg-success border-0" role="alert"
           aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            Swap confirmed: <span id="toast-output"></span>
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto"
                  data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- App script -->
  <script src="/dashboard.js"></script>
</body>
</html>
